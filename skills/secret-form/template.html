<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>{{TITLE}}</title>
<style>
  :root { color-scheme: light dark; --fg:#111; --muted:#5b6470; --bg:#fff;
          --card:#f5f6f8; --line:#d7dbe0; --accent:#1f6feb; }
  @media (prefers-color-scheme: dark) {
    :root { --fg:#e8eaed; --muted:#9aa4b2; --bg:#101317; --card:#171b21;
            --line:#2a3038; --accent:#6ea8fe; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:32px 20px; background:var(--bg); color:var(--fg);
         font:15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width:560px; margin:0 auto; }
  h1 { font-size:20px; margin:0 0 6px; }
  .purpose { margin:0 0 20px; color:var(--muted); }
  .dest { background:var(--card); border:1px solid var(--line); border-radius:10px;
          padding:12px 14px; margin:0 0 22px; font-size:13.5px; }
  .field { margin:0 0 18px; }
  label { display:block; font-weight:600; margin-bottom:2px; }
  code { font:13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .tag { font-weight:400; font-size:12px; color:var(--muted); margin-left:6px; }
  .hint { margin:0 0 6px; color:var(--muted); font-size:13px; }
  .row { display:flex; gap:8px; }
  input { flex:1; padding:9px 11px; font:14px ui-monospace, monospace;
          color:var(--fg); background:var(--bg); border:1px solid var(--line);
          border-radius:8px; }
  input:focus { outline:2px solid var(--accent); outline-offset:1px; }
  .reveal { padding:0 12px; font-size:13px; color:var(--muted); background:var(--card);
            border:1px solid var(--line); border-radius:8px; cursor:pointer; }
  .actions { display:flex; gap:10px; margin-top:26px; }
  button.primary { flex:1; padding:11px; font-size:15px; font-weight:600; color:#fff;
                   background:var(--accent); border:0; border-radius:9px; cursor:pointer; }
  button.plain { padding:11px 16px; font-size:15px; color:var(--muted);
                 background:transparent; border:1px solid var(--line);
                 border-radius:9px; cursor:pointer; }
  footer { margin-top:26px; padding-top:14px; border-top:1px solid var(--line);
           color:var(--muted); font-size:12px; }
  .warn { color:#b4530a; }
  @media (prefers-color-scheme: dark) { .warn { color:#f0a35e; } }
</style></head>
<body><main>
  <h1>{{TITLE}}</h1>
  <p class="purpose">{{PURPOSE}}</p>
  <div class="dest">{{DESTINATION}}</div>
  <form method="post" action="{{ACTION}}" autocomplete="off">
{{FIELDS}}
    <p class="hint warn">Type here, not into the agent's chat.</p>
    <div class="actions">
      <button class="primary" type="submit" name="action" value="submit">Save</button>
      <button class="plain" type="submit" name="action" value="cancel" formnovalidate>Cancel</button>
    </div>
  </form>
  <footer>{{FOOTER}}</footer>
</main>
<script>
for (const b of document.querySelectorAll(".reveal")) {
  b.addEventListener("click", () => {
    const input = document.getElementById(b.dataset.for);
    const shown = input.type === "text";
    input.type = shown ? "password" : "text";
    b.textContent = shown ? "show" : "hide";
  });
}
</script>
</body></html>
