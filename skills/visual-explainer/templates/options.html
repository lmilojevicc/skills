<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Options Comparison</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%23c23c14'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-paper:    oklch(96%  0.012 80);
      --color-paper-2:  oklch(93%  0.014 80);
      --color-rule:     oklch(82%  0.010 80);
      --color-neutral:  oklch(56%  0.008 80);
      --color-muted:    oklch(40%  0.008 70);
      --color-ink:      oklch(18%  0.010 60);
      --color-accent:   oklch(55%  0.19  45);
      --color-focus:    oklch(55%  0.19  55);
      --color-series-1: oklch(45%  0.05  60);
      --color-series-2: oklch(60%  0.04  70);
      --color-series-3: oklch(72%  0.03  75);
      --font-display: "Fraunces", ui-serif, Georgia, serif;
      --font-body:    "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
      --font-mono:    "JetBrains Mono", ui-monospace, monospace;
      --text-xs:   0.64rem;
      --text-sm:   0.8rem;
      --text-base: 1rem;
      --text-md:   1.25rem;
      --text-lg:   1.5625rem;
      --text-xl:   1.9531rem;
      --space-xs:  0.5rem;
      --space-sm:  0.75rem;
      --space-md:  1rem;
      --space-lg:  1.5rem;
      --space-xl:  2.5rem;
      --space-2xl: 4rem;
      --space-3xl: 6rem;
      --ease-out:    cubic-bezier(0.16, 1, 0.3, 1);
      --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
      --dur-fast:    150ms;
      --dur-base:    300ms;
      --dur-slow:    500ms;
    }

    html[data-theme="dark"] {
      --color-paper:    oklch(14%  0.008 80);
      --color-paper-2:  oklch(18%  0.010 80);
      --color-rule:     oklch(30%  0.008 80);
      --color-neutral:  oklch(58%  0.008 80);
      --color-muted:    oklch(72%  0.006 80);
      --color-ink:      oklch(94%  0.006 80);
      --color-accent:   oklch(65%  0.16  55);
      --color-focus:    oklch(70%  0.19  55);
      --color-series-1: oklch(55%  0.05  60);
      --color-series-2: oklch(65%  0.04  70);
      --color-series-3: oklch(75%  0.03  75);
    }

    @media (prefers-color-scheme: dark) {
      html:not([data-theme]) {
        --color-paper:    oklch(14%  0.008 80);
        --color-paper-2:  oklch(18%  0.010 80);
        --color-rule:     oklch(30%  0.008 80);
        --color-neutral:  oklch(58%  0.008 80);
        --color-muted:    oklch(72%  0.006 80);
        --color-ink:      oklch(94%  0.006 80);
        --color-accent:   oklch(65%  0.16  55);
        --color-focus:    oklch(70%  0.19  55);
        --color-series-1: oklch(55%  0.05  60);
        --color-series-2: oklch(65%  0.04  70);
        --color-series-3: oklch(75%  0.03  75);
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { overflow-x: clip; }
    body { overflow-x: clip; }

    body {
      background: var(--color-paper);
      color: var(--color-ink);
      font-family: var(--font-body);
      font-size: var(--text-base);
      line-height: 1.6;
      min-height: 100vh;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: var(--space-3xl) var(--space-2xl) var(--space-2xl);
    }

    header { margin-bottom: var(--space-2xl); }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: var(--text-xs);
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--color-accent);
      margin-bottom: var(--space-sm);
    }

    h1 {
      font-family: var(--font-display);
      font-size: var(--text-xl);
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: -0.015em;
      margin-bottom: var(--space-sm);
      max-width: 24ch;
    }

    .subtitle {
      color: var(--color-muted);
      font-size: var(--text-base);
      max-width: 55ch;
    }

    /* Options grid — varied column widths, not identical */
    .options-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr));
      gap: var(--space-lg);
      margin-bottom: var(--space-xl);
    }

    /* Option cards are buttons — clickable, keyboard-accessible */
    .option-card {
      background: var(--color-paper-2);
      border: 1px solid var(--color-rule);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-width: 0;
      cursor: pointer;
      text-align: left;
      font: inherit;
      color: inherit;
      padding: 0;
      transition: border-color var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out);
    }

    .option-card:hover {
      border-color: var(--color-neutral);
      transform: translateY(-2px);
    }

    .option-card:focus-visible {
      outline: 2px solid var(--color-focus);
      outline-offset: 2px;
    }

    .option-card.selected {
      border: 2px solid var(--color-accent);
    }

    .option-card.recommended {
      border: 2px solid var(--color-accent);
    }

    .option-card.selected.recommended {
      border-width: 2px;
      border-style: solid;
    }

    .option-header {
      padding: var(--space-md) var(--space-lg);
      border-bottom: 1px solid var(--color-rule);
      display: flex;
      align-items: baseline;
      gap: var(--space-sm);
    }

    .option-letter {
      font-family: var(--font-mono);
      font-size: var(--text-sm);
      font-weight: 500;
      color: var(--color-accent);
    }

    .option-name {
      font-family: var(--font-display);
      font-size: var(--text-md);
      font-weight: 600;
      letter-spacing: -0.01em;
      min-width: 0;
      overflow-wrap: break-word;
    }

    /* Check marker — shows selection state */
    .check-marker {
      margin-left: auto;
      font-family: var(--font-mono);
      font-size: var(--text-sm);
      color: var(--color-accent);
      opacity: 0;
      transition: opacity var(--dur-fast) var(--ease-out);
      white-space: nowrap;
    }
    .option-card.selected .check-marker { opacity: 1; }

    .recommended-badge {
      font-family: var(--font-mono);
      font-size: var(--text-xs);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--color-accent);
      border: 1px solid var(--color-accent);
      border-radius: 4px;
      padding: 0.125rem var(--space-sm);
      margin-left: auto;
      white-space: nowrap;
    }

    .option-card.selected .recommended-badge { margin-left: 0; }

    /* Preview area — where the mockup/diagram/code goes */
    .option-preview {
      padding: var(--space-lg);
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
    }

    .option-tradeoff {
      padding: var(--space-md) var(--space-lg);
      border-top: 1px solid var(--color-rule);
      font-size: var(--text-sm);
      color: var(--color-muted);
      min-width: 0;
    }

    /* Mock UI building blocks for previews */
    .mock-nav {
      display: flex;
      align-items: center;
      gap: var(--space-md);
      padding: var(--space-sm) var(--space-md);
      border: 1px solid var(--color-rule);
      border-radius: 6px;
      font-size: var(--text-sm);
      color: var(--color-muted);
      margin-bottom: var(--space-sm);
      white-space: nowrap;
      overflow: hidden;
    }
    .mock-nav .logo {
      font-family: var(--font-display);
      font-weight: 600;
      color: var(--color-ink);
    }
    .mock-sidebar {
      border: 1px solid var(--color-rule);
      border-radius: 6px;
      padding: var(--space-sm);
      font-size: var(--text-sm);
      color: var(--color-muted);
      min-height: 120px;
      flex: 0 0 110px;
    }
    .mock-content {
      border: 1px solid var(--color-rule);
      border-radius: 6px;
      padding: var(--space-sm);
      font-size: var(--text-sm);
      color: var(--color-muted);
      flex: 1;
      min-height: 120px;
      min-width: 0;
    }
    .mock-button {
      display: inline-block;
      border: 1px solid var(--color-rule);
      border-radius: 4px;
      padding: 0.25rem 0.75rem;
      font-size: var(--text-sm);
      color: var(--color-ink);
      background: transparent;
    }
    .mock-button.primary {
      border-color: var(--color-accent);
      color: var(--color-accent);
    }
    .mock-input {
      border: 1px solid var(--color-rule);
      border-radius: 4px;
      padding: 0.25rem 0.5rem;
      font-size: var(--text-sm);
      font-family: var(--font-body);
      background: var(--color-paper);
      width: 100%;
      min-width: 0;
    }
    .placeholder {
      border: 1px dashed var(--color-rule);
      border-radius: 6px;
      padding: var(--space-md);
      text-align: center;
      font-size: var(--text-sm);
      color: var(--color-neutral);
    }

    /* Mermaid inside option previews */
    .option-preview .mermaid {
      display: flex;
      justify-content: center;
      min-width: min-content;
    }
    .mermaid .nodeLabel { color: var(--color-ink) !important; font-family: var(--font-body) !important; }
    .mermaid .edgeLabel { color: var(--color-muted) !important; background-color: var(--color-paper) !important; font-family: var(--font-mono) !important; font-size: 11px !important; }
    .mermaid .edgeLabel rect { fill: var(--color-paper) !important; }

    .section { margin-bottom: var(--space-2xl); }

    .response-prompt {
      font-size: var(--text-base);
      color: var(--color-muted);
      border-top: 1px solid var(--color-rule);
      padding-top: var(--space-lg);
      max-width: 65ch;
    }

    .colophon {
      font-family: var(--font-mono);
      font-size: var(--text-xs);
      color: var(--color-neutral);
      border-top: 1px solid var(--color-rule);
      padding-top: var(--space-md);
      margin-top: var(--space-3xl);
      letter-spacing: 0.02em;
    }

    :focus-visible {
      outline: 2px solid var(--color-focus);
      outline-offset: 2px;
    }

    /* ---------- Theme toggle ---------- */
    .theme-toggle {
      position: fixed;
      top: var(--space-lg);
      right: var(--space-lg);
      display: inline-flex;
      align-items: center;
      gap: var(--space-xs);
      font-family: var(--font-mono);
      font-size: var(--text-xs);
      letter-spacing: 0.04em;
      color: var(--color-muted);
      background: var(--color-paper);
      border: 1px solid var(--color-rule);
      border-radius: 999px;
      padding: var(--space-xs) var(--space-md);
      cursor: pointer;
      z-index: 600;
      transition: border-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
    }
    .theme-toggle:hover { border-color: var(--color-accent); color: var(--color-accent); }

    .tt-glyph { display: none; }
    html[data-theme="dark"]  .theme-toggle .tt-dark  { display: inline; }
    html[data-theme="light"] .theme-toggle .tt-light { display: inline; }
    html:not([data-theme])    .theme-toggle .tt-auto  { display: inline; }
    html:not([data-theme])    .theme-toggle .tt-label::after { content: 'auto'; }
    html[data-theme="dark"]   .theme-toggle .tt-label::after { content: 'dark'; }
    html[data-theme="light"]  .theme-toggle .tt-label::after { content: 'light'; }

    /* ---------- Entrance animation ---------- */
    .ve-in { opacity: 0; animation: ve-in var(--dur-slow) var(--ease-out) forwards; }

    @keyframes ve-in {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      .ve-in { opacity: 1; }
      .option-card:hover { transform: none; }
    }
  </style>
</head>
<body>
  <button class="theme-toggle" id="themeToggle" aria-label="Toggle color theme" title="Theme: auto">
    <span class="tt-glyph tt-auto">◐</span>
    <span class="tt-glyph tt-light">☀</span>
    <span class="tt-glyph tt-dark">☾</span>
    <span class="tt-label"></span>
  </button>

  <main>
    <header class="ve-in">
      <p class="eyebrow">Decision · Layout</p>
      <h1>Which sidebar layout?</h1>
      <p class="subtitle">Three structural directions for the navigation. Pick one and I'll build it out.</p>
    </header>

    <div class="options-grid">
      <!-- ============ OPTION A ============ -->
      <button class="option-card ve-in" style="animation-delay: 60ms;" aria-pressed="false">
        <div class="option-header">
          <span class="option-letter">A</span>
          <span class="option-name">Collapsible sidebar</span>
          <span class="check-marker">✓</span>
        </div>
        <div class="option-preview">
          <!-- Mockup: sidebar + content -->
          <div class="mock-nav">
            <span class="logo">Logo</span>
            <span>Dashboard</span>
            <span>Orders</span>
            <span>Settings</span>
          </div>
          <div style="display: flex; gap: var(--space-sm); min-width: 0;">
            <div class="mock-sidebar">
              <p>Nav item</p>
              <p>Nav item</p>
              <p>Nav item</p>
            </div>
            <div class="mock-content">
              <p>Main content area</p>
              <p style="margin-top: var(--space-xs);">Workspace here</p>
            </div>
          </div>
        </div>
        <div class="option-tradeoff">
          Familiar pattern, works at any depth — but consumes ~240px of horizontal space permanently.
        </div>
      </button>
      <!-- ============ /OPTION A ============ -->

      <!-- ============ OPTION B (recommended, pre-selected) ============ -->
      <button class="option-card recommended selected ve-in" style="animation-delay: 120ms;" aria-pressed="true">
        <div class="option-header">
          <span class="option-letter">B</span>
          <span class="option-name">Icon rail + flyout</span>
          <span class="recommended-badge">Recommended</span>
          <span class="check-marker">✓</span>
        </div>
        <div class="option-preview">
          <div class="mock-nav">
            <span class="logo">Logo</span>
            <span>Dashboard</span>
            <span>Orders</span>
            <span>Settings</span>
          </div>
          <div style="display: flex; gap: var(--space-sm); min-width: 0;">
            <div class="mock-sidebar" style="flex: 0 0 48px; min-width: 48px;">
              <p style="text-align: center;">▦</p>
              <p style="text-align: center;">▤</p>
              <p style="text-align: center;">⚙</p>
            </div>
            <div class="mock-content">
              <p>Main content area</p>
              <p style="margin-top: var(--space-xs);">Full width available when rail is collapsed</p>
            </div>
          </div>
        </div>
        <div class="option-tradeoff">
          Maximizes content space, scales to many sections — but hides labels until hover, adding a discoverability cost.
        </div>
      </button>
      <!-- ============ /OPTION B ============ -->

      <!-- ============ OPTION C ============ -->
      <button class="option-card ve-in" style="animation-delay: 180ms;" aria-pressed="false">
        <div class="option-header">
          <span class="option-letter">C</span>
          <span class="option-name">Top bar tabs</span>
          <span class="check-marker">✓</span>
        </div>
        <div class="option-preview">
          <div class="mock-nav">
            <span class="logo">Logo</span>
            <span style="border-bottom: 2px solid var(--color-accent); padding-bottom: 0.125rem;">Dashboard</span>
            <span>Orders</span>
            <span>Settings</span>
          </div>
          <div style="display: flex; gap: var(--space-sm); min-width: 0;">
            <div class="mock-content" style="flex: 1;">
              <p>Main content area</p>
              <p style="margin-top: var(--space-xs);">Full viewport width</p>
            </div>
          </div>
        </div>
        <div class="option-tradeoff">
          Full-width content and simplest DOM — but doesn't scale beyond ~6 sections before tabs wrap.
        </div>
      </button>
      <!-- ============ /OPTION C ============ -->
    </div>

    <p class="response-prompt ve-in" style="animation-delay: 240ms;">
      Click a card to mark a favourite — the selection is visual only. Tell me your pick in chat and I'll build it out.
    </p>

    <footer class="colophon">
      Generated with visual-explainer
    </footer>
  </main>

  <!-- Theme toggle -->
  <script>
    (function () {
      const KEY = 'visual-explainer:theme';
      const ORDER = ['auto', 'light', 'dark'];
      const mq = window.matchMedia('(prefers-color-scheme: dark)');

      function apply(theme) {
        if (theme === 'auto') {
          document.documentElement.removeAttribute('data-theme');
        } else {
          document.documentElement.setAttribute('data-theme', theme);
        }
        const btn = document.getElementById('themeToggle');
        if (btn) btn.title = 'Theme: ' + theme;
        document.documentElement.dispatchEvent(new CustomEvent('themechange', { detail: theme }));
      }

      const saved = localStorage.getItem(KEY);
      if (saved && ORDER.includes(saved)) apply(saved);

      mq.addEventListener('change', () => {
        if (!document.documentElement.dataset.theme) {
          document.documentElement.dispatchEvent(new CustomEvent('themechange', { detail: 'auto' }));
        }
      });

      const btn = document.getElementById('themeToggle');
      if (btn) btn.addEventListener('click', () => {
        const current = document.documentElement.dataset.theme || 'auto';
        const next = ORDER[(ORDER.indexOf(current) + 1) % ORDER.length];
        localStorage.setItem(KEY, next);
        apply(next);
      });
    })();
  </script>

  <!-- Click-to-select — visual aid only, nothing is recorded -->
  <script>
    document.querySelectorAll('.option-card').forEach(card => {
      card.addEventListener('click', () => {
        document.querySelectorAll('.option-card.selected').forEach(c => {
          c.classList.remove('selected');
          c.setAttribute('aria-pressed', 'false');
        });
        card.classList.add('selected');
        card.setAttribute('aria-pressed', 'true');
      });
    });
  </script>
</body>
</html>
