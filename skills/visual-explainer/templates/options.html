<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Which sidebar layout?</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%23171717'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:        #fafaf9;
      --surface:   #f1f1ef;
      --surface-2: #e6e6e3;
      --line:      #d6d6d2;
      --bar:       #cfcfca;
      --ink:       #171717;
      --muted:     #5c5c5c;
      --accent:    #0b62d6;

      --font-sans: "IBM Plex Sans", ui-sans-serif, sans-serif;
      --font-mono: "IBM Plex Mono", ui-monospace, monospace;

      --fs-title: clamp(1.75rem, 1.2rem + 2.2vw, 2.5rem);
      --fs-head:  1.125rem;
      --fs-body:  1rem;
      --fs-small: 0.8125rem;

      --radius: 6px;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }

    html[data-theme="dark"] {
      --bg:        #111111;
      --surface:   #1b1b1b;
      --surface-2: #262626;
      --line:      #333333;
      --bar:       #444444;
      --ink:       #ececec;
      --muted:     #a1a1a1;
      --accent:    #5b9cf5;
    }

    @media (prefers-color-scheme: dark) {
      html:not([data-theme]) {
        --bg:        #111111;
        --surface:   #1b1b1b;
        --surface-2: #262626;
        --line:      #333333;
        --bar:       #444444;
        --ink:       #ececec;
        --muted:     #a1a1a1;
        --accent:    #5b9cf5;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { overflow-x: clip; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-sans);
      font-size: var(--fs-body);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 96px 24px 48px;
      display: flex;
      flex-direction: column;
      gap: 64px;
    }
    main > * { min-width: 0; }

    h1, h2, h3 {
      font-family: var(--font-mono);
      font-weight: 500;
      line-height: 1.15;
      letter-spacing: -0.03em;
    }
    h1 { font-size: var(--fs-title); max-width: 22ch; }
    h2 { font-size: var(--fs-head); margin-bottom: 16px; }

    .lede { margin-top: 16px; max-width: 56ch; }

    .panel {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 24px;
    }

    .takeaways {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 64ch;
    }
    .takeaways li { padding-left: 20px; position: relative; }
    .takeaways li::before {
      content: "–";
      position: absolute;
      left: 0;
      color: var(--muted);
    }

    .note, footer { font-size: var(--fs-small); color: var(--muted); }

    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .theme-toggle {
      position: fixed;
      top: 16px;
      right: 16px;
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      color: var(--muted);
      background: none;
      border: 0;
      border-radius: var(--radius);
      cursor: pointer;
      transition: color 150ms var(--ease), background 150ms var(--ease);
    }
    .theme-toggle[hidden] { display: none; }
    .theme-toggle:hover { color: var(--ink); background: var(--surface); }
    .theme-toggle svg {
      display: none;
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    html:not([data-theme]) .tt-system,
    html[data-theme="light"] .tt-light,
    html[data-theme="dark"] .tt-dark { display: block; }

    .ve-in { animation: ve-in 400ms var(--ease) both; }
    @keyframes ve-in {
      from { opacity: 0; transform: translateY(8px); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }

    .options {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }

    .option {
      font: inherit;
      color: inherit;
      text-align: left;
      background: var(--surface);
      border: 0;
      border-radius: var(--radius);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-width: 0;
      cursor: pointer;
      outline: 2px solid transparent;
      outline-offset: -2px;
      transition: outline-color 150ms var(--ease), background 150ms var(--ease);
    }
    .option:hover { background: var(--surface-2); }
    .option.selected { outline-color: var(--accent); }
    .option:focus-visible { outline-color: var(--accent); outline-offset: 2px; }

    .option-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
    .option-head h2 { margin: 0; }
    .option-letter { color: var(--muted); }
    .recommended { font-size: var(--fs-small); color: var(--accent); }

    /* Preview: where the mockup, diagram or code goes */
    .preview {
      background: var(--bg);
      border-radius: 4px;
      padding: 12px;
      min-height: 168px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 0;
      overflow: hidden;
      font-size: var(--fs-small);
    }
    .mock-bar { display: flex; gap: 12px; align-items: center; color: var(--muted); }
    .mock-bar b { font-weight: 500; color: var(--ink); margin-right: auto; }
    .mock-bar .active { color: var(--ink); text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 4px; }
    .mock-row { display: flex; gap: 8px; flex: 1; min-width: 0; }
    .mock-side { flex: 0 0 72px; background: var(--surface-2); border-radius: 3px; padding: 8px; color: var(--muted); }
    .mock-side.rail { flex-basis: 28px; }
    .mock-main { flex: 1; min-width: 0; background: var(--surface); border-radius: 3px; padding: 8px; color: var(--muted); }

    .tradeoff { color: var(--muted); font-size: var(--fs-small); line-height: 1.5; }

    @media (max-width: 640px) {
      main { padding: 72px 16px 32px; gap: 48px; }
      .panel { padding: 16px; }
      .theme-toggle { top: 12px; right: 12px; }
    }
  </style>
</head>
<body>
  <button class="theme-toggle" id="themeToggle" type="button" aria-label="Theme: system" title="Theme: system" hidden>
    <svg class="tt-system" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
    <svg class="tt-light" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="tt-dark" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
  </button>

  <main>
    <header class="ve-in">
      <h1>Which sidebar layout?</h1>
      <p class="lede">Three structural directions for the navigation. Pick one and I'll build it.</p>
    </header>

    <div class="options">
      <!-- ============ OPTION A ============ -->
      <button class="option ve-in" style="animation-delay: 60ms;" type="button" aria-pressed="false">
        <div class="option-head">
          <h2><span class="option-letter">A</span> Collapsible sidebar</h2>
        </div>
        <div class="preview">
          <div class="mock-bar"><b>Acme</b><span>Search</span></div>
          <div class="mock-row">
            <div class="mock-side">Overview<br>Orders<br>Settings</div>
            <div class="mock-main">Main content</div>
          </div>
        </div>
        <p class="tradeoff">Familiar and works at any depth, but takes about 240px of width at all times.</p>
      </button>

      <!-- ============ OPTION B (recommended, pre-selected) ============ -->
      <button class="option selected ve-in" style="animation-delay: 120ms;" type="button" aria-pressed="true">
        <div class="option-head">
          <h2><span class="option-letter">B</span> Icon rail and flyout</h2>
          <span class="recommended">Recommended</span>
        </div>
        <div class="preview">
          <div class="mock-bar"><b>Acme</b><span>Search</span></div>
          <div class="mock-row">
            <div class="mock-side rail"></div>
            <div class="mock-main">Main content, nearly full width</div>
          </div>
        </div>
        <p class="tradeoff">Most room for content and scales to many sections, but labels hide until hover.</p>
      </button>

      <!-- ============ OPTION C ============ -->
      <button class="option ve-in" style="animation-delay: 180ms;" type="button" aria-pressed="false">
        <div class="option-head">
          <h2><span class="option-letter">C</span> Top bar tabs</h2>
        </div>
        <div class="preview">
          <div class="mock-bar"><b>Acme</b><span class="active">Overview</span><span>Orders</span><span>Settings</span></div>
          <div class="mock-row">
            <div class="mock-main">Main content, full width</div>
          </div>
        </div>
        <p class="tradeoff">Full-width content and the simplest markup, but tabs wrap past about six sections.</p>
      </button>
    </div>

    <p class="note ve-in" style="animation-delay: 240ms;">
      Clicking a card only marks it on this page. Tell me your pick in chat.
    </p>

    <footer>Generated with visual-explainer</footer>
  </main>

  <script>
    (function () {
      const KEY = 'visual-explainer:theme';
      const ORDER = ['system', 'light', 'dark'];
      const root = document.documentElement;
      const btn = document.getElementById('themeToggle');

      function apply(theme) {
        if (theme === 'system') root.removeAttribute('data-theme');
        else root.setAttribute('data-theme', theme);
        btn.setAttribute('aria-label', 'Theme: ' + theme);
        btn.title = 'Theme: ' + theme;
        root.dispatchEvent(new CustomEvent('themechange', { detail: theme }));
      }

      let saved = null;
      try { saved = localStorage.getItem(KEY); } catch (e) {}
      if (ORDER.includes(saved)) apply(saved);

      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
        if (!root.dataset.theme) root.dispatchEvent(new CustomEvent('themechange', { detail: 'system' }));
      });

      btn.hidden = false;
      btn.addEventListener('click', () => {
        const next = ORDER[(ORDER.indexOf(root.dataset.theme || 'system') + 1) % ORDER.length];
        try { localStorage.setItem(KEY, next); } catch (e) {}
        apply(next);
      });
    })();
  </script>

  <!-- Click to select: a visual aid only, nothing is recorded -->
  <script>
    document.querySelectorAll('.option').forEach(card => {
      card.addEventListener('click', () => {
        document.querySelectorAll('.option.selected').forEach(c => {
          c.classList.remove('selected');
          c.setAttribute('aria-pressed', 'false');
        });
        card.classList.add('selected');
        card.setAttribute('aria-pressed', 'true');
      });
    });
  </script>
</body>
</html>
