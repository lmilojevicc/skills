<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Visual Explanation</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%23171717'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:        #fafaf9;
      --surface:   #f1f1ef;
      --surface-2: #e6e6e3;
      --line:      #d6d6d2;
      --bar:       #cfcfca;
      --ink:       #171717;
      --muted:     #5c5c5c;
      --accent:    #0b62d6;

      --font-sans: "IBM Plex Sans", ui-sans-serif, sans-serif;
      --font-mono: "IBM Plex Mono", ui-monospace, monospace;

      --fs-title: clamp(1.75rem, 1.2rem + 2.2vw, 2.5rem);
      --fs-head:  1.125rem;
      --fs-body:  1rem;
      --fs-small: 0.8125rem;

      --radius: 6px;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }

    html[data-theme="dark"] {
      --bg:        #111111;
      --surface:   #1b1b1b;
      --surface-2: #262626;
      --line:      #333333;
      --bar:       #444444;
      --ink:       #ececec;
      --muted:     #a1a1a1;
      --accent:    #5b9cf5;
    }

    @media (prefers-color-scheme: dark) {
      html:not([data-theme]) {
        --bg:        #111111;
        --surface:   #1b1b1b;
        --surface-2: #262626;
        --line:      #333333;
        --bar:       #444444;
        --ink:       #ececec;
        --muted:     #a1a1a1;
        --accent:    #5b9cf5;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { overflow-x: clip; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-sans);
      font-size: var(--fs-body);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 96px 24px 48px;
      display: flex;
      flex-direction: column;
      gap: 64px;
    }
    main > * { min-width: 0; }

    h1, h2, h3 {
      font-family: var(--font-mono);
      font-weight: 500;
      line-height: 1.15;
      letter-spacing: -0.03em;
    }
    h1 { font-size: var(--fs-title); max-width: 22ch; }
    h2 { font-size: var(--fs-head); margin-bottom: 16px; }

    .lede { margin-top: 16px; max-width: 56ch; }

    .panel {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 24px;
    }

    .takeaways {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 64ch;
    }
    .takeaways li { padding-left: 20px; position: relative; }
    .takeaways li::before {
      content: "–";
      position: absolute;
      left: 0;
      color: var(--muted);
    }

    .note, footer { font-size: var(--fs-small); color: var(--muted); }

    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .theme-toggle {
      position: fixed;
      top: 16px;
      right: 16px;
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      color: var(--muted);
      background: none;
      border: 0;
      border-radius: var(--radius);
      cursor: pointer;
      transition: color 150ms var(--ease), background 150ms var(--ease);
    }
    .theme-toggle[hidden] { display: none; }
    .theme-toggle:hover { color: var(--ink); background: var(--surface); }
    .theme-toggle svg {
      display: none;
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    html:not([data-theme]) .tt-system,
    html[data-theme="light"] .tt-light,
    html[data-theme="dark"] .tt-dark { display: block; }

    .ve-in { animation: ve-in 400ms var(--ease) both; }
    @keyframes ve-in {
      from { opacity: 0; transform: translateY(8px); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }

    @media (max-width: 640px) {
      main { padding: 72px 16px 32px; gap: 48px; }
      .panel { padding: 16px; }
      .theme-toggle { top: 12px; right: 12px; }
    }
  </style>
</head>
<body>
  <button class="theme-toggle" id="themeToggle" type="button" aria-label="Theme: system" title="Theme: system" hidden>
    <svg class="tt-system" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
    <svg class="tt-light" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="tt-dark" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
  </button>

  <main>
    <header class="ve-in">
      <h1>Page title</h1>
      <p class="lede">One sentence saying what this visual shows.</p>
    </header>

    <section class="ve-in" style="animation-delay: 60ms;">
      <div class="panel">
        <!-- Visual content goes here -->
      </div>
    </section>

    <section class="ve-in" style="animation-delay: 120ms;">
      <h2>What to notice</h2>
      <ul class="takeaways">
        <li>The first thing the user should see</li>
        <li>A second point, only if it earns its place</li>
      </ul>
    </section>

    <footer>Generated with visual-explainer</footer>
  </main>

  <script>
    (function () {
      const KEY = 'visual-explainer:theme';
      const ORDER = ['system', 'light', 'dark'];
      const root = document.documentElement;
      const btn = document.getElementById('themeToggle');

      function apply(theme) {
        if (theme === 'system') root.removeAttribute('data-theme');
        else root.setAttribute('data-theme', theme);
        btn.setAttribute('aria-label', 'Theme: ' + theme);
        btn.title = 'Theme: ' + theme;
        root.dispatchEvent(new CustomEvent('themechange', { detail: theme }));
      }

      let saved = null;
      try { saved = localStorage.getItem(KEY); } catch (e) {}
      if (ORDER.includes(saved)) apply(saved);

      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
        if (!root.dataset.theme) root.dispatchEvent(new CustomEvent('themechange', { detail: 'system' }));
      });

      btn.hidden = false;
      btn.addEventListener('click', () => {
        const next = ORDER[(ORDER.indexOf(root.dataset.theme || 'system') + 1) % ORDER.length];
        try { localStorage.setItem(KEY, next); } catch (e) {}
        apply(next);
      });
    })();
  </script>
</body>
</html>
